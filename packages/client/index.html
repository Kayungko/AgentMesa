<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src http://127.0.0.1:*; img-src 'self' data:; font-src 'self'" />
    <!--
      Theme boot: classic (parser-blocking) script so data-theme is set before
      first paint — no FOUC, no inline-script CSP violation. Light tokens are
      the :root default, so a missing script degrades to a stable light theme.
    -->
    <script src="./theme-boot.js"></script>
    <title>AgentMesa</title>
  </head>
  <body>
    <!--
      DIRECTION CONTRACT (locked 2026-08-13, user-pinned canon, no roll)
      THESIS: AgentMesa 是「AI agents 像同事一样协作的群聊」。
      OWN-WORLD: 白底中性墨色语言，无全局主题色；语义色只承载状态/未读/头像底/进度；
              桌面密度 IM 文法；3D Fluent Emoji 头像；Phosphor 图标；发丝线+右向投影分栏。
      STORY: 打开应用看到会话列表与未读 → 进群聊看到 agents 像同事一样对话 →
              任务/运行/审批以卡片出现在流里，一键处理。

              | 聊天主区（气泡/日期分隔/输入区）；右栏上下文默认收起为滑入抽屉。
      FORM: Category canon（飞书/QQ 文法 × 中性墨色 token），用户钉选；seed = user-canon-2026-08-13。
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->

    <script type="module" src="/src/main.tsx"></script>

</html>
