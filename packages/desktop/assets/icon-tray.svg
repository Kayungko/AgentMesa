<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- AgentMesa tray icon — bare flat-topped M monogram on transparent bg.
       Follows Windows notification-area guidance: designed on the 16x16
       grid with the glyph filling nearly the full canvas (~1px clearspace
       at 16px) and strictly centered (higher-density rasters are supplied
       separately for 125-200% scaling). Monochrome black, per design. -->
  <path d="M10 50 V14 H25 L32 25 L39 14 H54 V50"
        fill="none" stroke="#000000" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
