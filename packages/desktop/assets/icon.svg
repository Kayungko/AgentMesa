<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- AgentMesa app icon
       Brand: purple (#8B7CFF family, carried over from the original tray pixel art)
       Motif: a flat-topped mesa silhouette with an agent dot standing on it.
       Kept deliberately simple so it stays legible at 16px tray size. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9D8FFF"/>
      <stop offset="1" stop-color="#7A6BEF"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <path d="M15 47 L24 32 L40 32 L49 47 Z" fill="#FFFFFF"/>
  <circle cx="32" cy="21" r="4.5" fill="#FFFFFF"/>
</svg>
